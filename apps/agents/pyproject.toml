[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cold_call_agents"
version = "0.1.0"
description = "Prospect-research agents for Cold Call Conversion (v0, sample data only)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["cold_call_agents*"]

[tool.setuptools.package-data]
cold_call_agents = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
